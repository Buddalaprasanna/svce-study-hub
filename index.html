<!DOCTYPE html>  
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVCE Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#0f172a;
overflow:hidden;
position:relative; 
padding:20px;
}

/* Background Logo */
body::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:url("svce.png") center center no-repeat;
background-size:cover;
opacity:0.12;
animation:logoMove 10s ease-in-out infinite;
}

@keyframes logoMove{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* Login Card */
.login-card{
position:relative;
z-index:2;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
padding:40px;
border-radius:20px;
width:90%;
max-width:340px;
box-shadow:0 30px 60px rgba(0,0,0,0.4);
opacity:0;
transform:translateY(60px);
animation:cardRise 1.2s ease forwards;
animation-delay:0.5s;
}

@keyframes cardRise{
to{
opacity:1;
transform:translateY(0);
}
}

h2{
color:white;
text-align:center;
margin-bottom:20px;
}

/* Inputs */
input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.2);
color:white;
outline:none;
font-size:16px;
}

input::placeholder{
color:#ddd;
}

/* Password wrapper */
.password-box{
position:relative;
}

.password-box span{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:14px;
color:#ddd;
}

/* Button */
button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#ff6b6b,#feca57);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* Message */
#message{
font-size:14px;
margin-top:5px;
text-align:left;
padding-left:5px;
}

/* Mobile */
@media (max-width:480px){
.login-card{
padding:30px;
border-radius:15px;
}

h2{
font-size:20px;
}
}

</style>
</head>

<body>

<div class="login-card">
<h2>SVCE Portal</h2>

<input type="email" id="email" placeholder="Email" oninput="checkEmail()">

<div class="password-box">
<input type="password" id="password" placeholder="Password">
<span onclick="togglePassword()">👁</span>
</div>

<p id="message"></p>

<button type="button" onclick="login()">Sign In</button>

</div>

<script>

    

/* Gmail Validation */
function checkEmail(){
    const email = document.getElementById("email").value;
    const message = document.getElementById("message");

    if(email === ""){
        message.innerText = "";
    }
    else if(!email.endsWith("@svce.eng.in")){
        message.innerText = "Use college email (@svce.eng.in) ❌";
        message.style.color = "red";
    }
    else{
        message.innerText = "Valid SVCE Email ✅";
        message.style.color = "lightgreen";
    }
}
/* Login */
function login(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(email === "" || password === ""){
        alert("Please enter email and password");
        return;
    }

    if(!email.endsWith("@svce.eng.in")){
        alert("Only SVCE college email allowed ❌");
        return;
    }

    let username = email.split("@")[0];
    localStorage.setItem("username", username);

    window.location.href = "home.html";
}

/* Enter key support */
document.getElementById("email").addEventListener("keydown", function(e){
    if(e.key === "Enter") login();
});

document.getElementById("password").addEventListener("keydown", function(e){
    if(e.key === "Enter") login();
});

</script>

</body>
</html>
